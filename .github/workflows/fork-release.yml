name: Fork CI and Release

on:
  pull_request:
    branches:
      - 'charlie/v1.2.2-stable'
  push:
    tags:
      - 'v*-chuck.*'

permissions:
  contents: read

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  linux:
    name: Validate and package Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install cross compiler
        run: |
          # The hosted image's optional Chrome feed occasionally rotates its
          # Packages file before the signed Release metadata, breaking apt for
          # unrelated packages. The fork build does not use Chrome.
          for source in /etc/apt/sources.list.d/google-chrome.*; do
            if [ -e "$source" ]; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run regression and template tests
        run: >-
          ./scripts/test.sh
          -run '^(TestOutputContextFunction|TestPrimeNeverEmitsGitAuthority|TestDirectoryFlagChangesCommandWorkingDirectory|TestCodexHook.*|TestEmbeddedDefault.*|TestRenderSection.*|TestGeneratedAgentSectionsNeverAssertGitAuthority|TestGeneratedRecipesNeverAssertGitAuthority)$'
          ./cmd/bd ./internal/templates/agents ./internal/recipes

      - name: Build and package Linux binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version//\//-}"
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short HEAD)"
          for arch in amd64 arm64; do
            if [ "$arch" = arm64 ]; then
              export CC=aarch64-linux-gnu-gcc
            else
              export CC=gcc
            fi
            export CGO_ENABLED=1 GOOS=linux GOARCH="$arch"
            staging="beads_${version}_linux_${arch}"
            mkdir -p "$staging"
            go build -tags "gms_pure_go netgo" \
              -ldflags "-s -w -X main.Version=${version} -X main.Build=${short_commit} -X main.Commit=${commit} -X main.Branch=${GITHUB_REF_NAME}" \
              -o "$staging/bd" ./cmd/bd
            ./scripts/verify-cgo.sh "$staging/bd"
            cp LICENSE README.md CHANGELOG.md "$staging/"
            tar -czf "${staging}.tar.gz" -C "$staging" .
            sha256sum "${staging}.tar.gz" >> checksums.txt
          done

      - name: Upload Linux packages for validation or release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-linux-packages
          path: |
            beads_*_linux_*.tar.gz
            checksums.txt
          if-no-files-found: error
          overwrite: true

  macos:
    name: Validate and package macOS
    runs-on: macos-latest
    env:
      # The hosted runner tracks the newest SDK. Without an explicit target,
      # clang stamps that runner's OS as LC_BUILD_VERSION.minOS and the binary
      # will not launch on older macOS versions supported by Vibery Desktop.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Build and package macOS binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version//\//-}"
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short HEAD)"
          for arch in arm64 amd64; do
            export CGO_ENABLED=1 GOOS=darwin GOARCH="$arch"
            if [ "$arch" = amd64 ]; then
              export CC="clang -arch x86_64"
              export CXX="clang++ -arch x86_64"
            else
              export CC=clang
              export CXX=clang++
            fi
            staging="beads_${version}_darwin_${arch}"
            mkdir -p "$staging"
            go build -tags "gms_pure_go netgo" \
              -ldflags "-s -w -X main.Version=${version} -X main.Build=${short_commit} -X main.Commit=${commit} -X main.Branch=${GITHUB_REF_NAME}" \
              -o "$staging/bd" ./cmd/bd
            ./scripts/verify-cgo.sh "$staging/bd"
            minos="$(vtool -show-build "$staging/bd" | awk '$1 == "minos" { print $2; exit }')"
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "ERROR: $staging/bd has unexpected minimum macOS version $minos; expected $MACOSX_DEPLOYMENT_TARGET" >&2
              vtool -show-build "$staging/bd" >&2
              exit 1
            fi
            codesign -s - -f "$staging/bd"
            cp LICENSE README.md CHANGELOG.md "$staging/"
            tar -czf "${staging}.tar.gz" -C "$staging" .
            shasum -a 256 "${staging}.tar.gz" >> darwin-checksums.txt
          done

      - name: Upload macOS packages for validation or release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-macos-packages
          path: |
            beads_*_darwin_*.tar.gz
            darwin-checksums.txt
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish complete fork release
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-linux-packages
          path: release/linux

      - name: Download macOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-macos-packages
          path: release/macos

      - name: Publish all platform packages together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat release/linux/checksums.txt release/macos/darwin-checksums.txt > release/checksums.txt
          assets=(
            release/linux/beads_*_linux_*.tar.gz
            release/macos/beads_*_darwin_*.tar.gz
            release/checksums.txt
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "$GITHUB_REF_NAME — beads without the bullshit" \
              --notes "Pinned ChuckMayo fork build. Beads never grants or revokes source Git permissions. Includes the verified -C working-directory fix." \
              "${assets[@]}"
          fi
